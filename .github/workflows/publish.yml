name: Publish VS Code extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: |
          npm run check-types
          npm run package

      - name: Package VSIX
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "VSIX=biomolecule-viewer-${version}.vsix" >> "$GITHUB_ENV"
          npx @vscode/vsce package --out "$VSIX"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: biomolecule-viewer-vsix
          path: ${{ env.VSIX }}
          retention-days: 30

      - name: Publish to Visual Studio Marketplace
        run: npx @vscode/vsce publish --oidc --packagePath "${{ env.VSIX }}"
